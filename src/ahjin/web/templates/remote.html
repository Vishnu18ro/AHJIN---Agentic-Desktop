<!DOCTYPE html>
<html>
<head>
    <title>AHJIN Remote Access</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; padding: 0; background-color: #000; display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-family: sans-serif; color: white;}
        #video-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden;}
        #screen { max-width: 100%; max-height: 100%; object-fit: contain; cursor: crosshair;}
        #keyboard-input { position: fixed; bottom: -1000px; opacity: 0; pointer-events: none;}
        #controls { height: 60px; background-color: #111; display: flex; justify-content: space-around; align-items: center; padding: 0 20px;}
        .btn { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px;}
        .btn:active { background: #555; }
        .keyboard-btn { background: #007bff; }
    </style>
</head>
<body>
    <div id="video-container">
        <!-- We use an image tag and update its src via WebSocket -->
        <img id="screen" alt="Waiting for screen..." />
    </div>
    
    <div id="controls">
        <button id="toggle-kb" class="btn keyboard-btn">Toggle Keyboard</button>
        <button id="refresh-btn" class="btn">Refresh Connection</button>
    </div>

    <!-- Hidden input to force mobile keyboard -->
    <input type="text" id="keyboard-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

    <script>
        const img = document.getElementById('screen');
        const toggleKbBtn = document.getElementById('toggle-kb');
        const keyboardInput = document.getElementById('keyboard-input');
        const refreshBtn = document.getElementById('refresh-btn');
        let ws;

        function connect() {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            
            ws.binaryType = "blob";

            ws.onmessage = function(event) {
                if (event.data instanceof Blob) {
                    const url = URL.createObjectURL(event.data);
                    const oldUrl = img.src;
                    img.src = url;
                    img.onload = () => { URL.revokeObjectURL(oldUrl); };
                }
            };

            ws.onclose = function() {
                setTimeout(connect, 2000);
            };
        }

        connect();

        // Handle clicks
        img.addEventListener('click', (e) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const rect = img.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Calculate percentage
                const x_pct = x / rect.width;
                const y_pct = y / rect.height;
                
                ws.send(JSON.stringify({
                    type: "click",
                    x: x_pct,
                    y: y_pct
                }));
            }
        });

        // Touch support
        img.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0 && ws && ws.readyState === WebSocket.OPEN) {
                const touch = e.touches[0];
                const rect = img.getBoundingClientRect();
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                
                const x_pct = x / rect.width;
                const y_pct = y / rect.height;
                
                ws.send(JSON.stringify({
                    type: "click",
                    x: x_pct,
                    y: y_pct
                }));
            }
        });

        // Handle Keyboard
        toggleKbBtn.addEventListener('click', () => {
            keyboardInput.focus();
            keyboardInput.click();
        });

        keyboardInput.addEventListener('input', (e) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                // Send the last character typed
                const text = keyboardInput.value;
                if (text.length > 0) {
                    ws.send(JSON.stringify({
                        type: "type",
                        text: text.charAt(text.length - 1)
                    }));
                }
            }
        });

        keyboardInput.addEventListener('keydown', (e) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                if (e.key === "Backspace" || e.key === "Enter") {
                    ws.send(JSON.stringify({
                        type: "type",
                        text: e.key
                    }));
                }
            }
        });

        refreshBtn.addEventListener('click', () => {
            if (ws) ws.close();
        });
    </script>
</body>
</html>
